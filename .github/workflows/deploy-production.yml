name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: masterbox-production
  cancel-in-progress: false

env:
  PROJECT_ID: masterbox-507211
  REGION: asia-east2
  REPOSITORY: masterbox
  RUNTIME_SERVICE_ACCOUNT: 744524789768-compute@developer.gserviceaccount.com
  API_SERVICE: masterbox-api
  ADMIN_SERVICE: masterbox-admin
  SUPER_ADMIN_SERVICE: masterbox-super-admin
  CUSTOMER_SERVICE: masterbox-customer
  LANDING_SERVICE: masterbox-landing

jobs:
  quality-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            admin/package-lock.json
            super-admin/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix admin
      - run: npm ci --prefix super-admin
      - run: npm run prisma:validate --prefix backend
      - run: npm run build --prefix admin
      - run: npm run build --prefix super-admin

  deploy:
    needs: quality-gates
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Configure Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push immutable images
        env:
          REGISTRY: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPOSITORY }}
        run: |
          set -euo pipefail
          tag="${REGISTRY}/masterbox-${GITHUB_SHA}"
          docker buildx build --platform linux/amd64 --file backend/Dockerfile --tag "${tag}-api" --push --provenance=false backend
          docker buildx build --platform linux/amd64 \
            --file admin/Dockerfile \
            --build-arg GRAPHQL_CONNECTION_PRODUCTION=https://api.masterbox.masterappinc.com/graphql \
            --build-arg GRAPHQL_WS_CONNECTION_PRODUCTION=wss://api.masterbox.masterappinc.com/graphql \
            --build-arg API_CONNECTION_PRODUCTION=https://api.masterbox.masterappinc.com \
            --tag "${tag}-admin" --push --provenance=false admin
          docker buildx build --platform linux/amd64 \
            --file super-admin/Dockerfile \
            --build-arg NEXT_PUBLIC_PLATFORM_API_URL=https://api.masterbox.masterappinc.com \
            --tag "${tag}-super-admin" --push --provenance=false super-admin
          docker buildx build --platform linux/amd64 --file flutter/Dockerfile --tag "${tag}-customer" --push --provenance=false flutter
          docker buildx build --platform linux/amd64 --file landing-page/Dockerfile --tag "${tag}-landing" --push --provenance=false landing-page
          printf 'API_IMAGE=%s-api\n' "$tag" >> "$GITHUB_ENV"
          printf 'ADMIN_IMAGE=%s-admin\n' "$tag" >> "$GITHUB_ENV"
          printf 'SUPER_ADMIN_IMAGE=%s-super-admin\n' "$tag" >> "$GITHUB_ENV"
          printf 'CUSTOMER_IMAGE=%s-customer\n' "$tag" >> "$GITHUB_ENV"
          printf 'LANDING_IMAGE=%s-landing\n' "$tag" >> "$GITHUB_ENV"

      - name: Create pre-deployment database backup
        run: |
          gcloud sql backups create \
            --project "$PROJECT_ID" \
            --instance masterbox-db \
            --description "pre-release-${GITHUB_SHA}"

      - name: Deploy API
        run: |
          gcloud run deploy "$API_SERVICE" \
            --project "$PROJECT_ID" --region "$REGION" --platform managed \
            --image "$API_IMAGE" --service-account "$RUNTIME_SERVICE_ACCOUNT" \
            --port 8080 --allow-unauthenticated \
            --set-env-vars NODE_ENV=production,META_BASE_URL=https://graph.facebook.com,META_API_VERSION=v23.0,META_API_TIMEOUT_MS=15000,LIVEKIT_TOKEN_TTL_SECONDS=300 \
            --set-secrets DATABASE_URL=DATABASE_URL:latest,JWT_SECRET=JWT_SECRET:latest,ACCESS_TOKEN_SECRET=ACCESS_TOKEN_SECRET:latest,REFRESH_TOKEN_SECRET=REFRESH_TOKEN_SECRET:latest,TOTP_ENCRYPTION_KEY=TOTP_ENCRYPTION_KEY:latest,EMBED_ACCESS_TOKEN_SECRET=EMBED_ACCESS_TOKEN_SECRET:latest,REDIS_CONNECTION=REDIS_CONNECTION:latest,CORS_ALLOWED_ORIGINS=CORS_ALLOWED_ORIGINS:latest

      - name: Deploy frontends
        run: |
          set -euo pipefail
          deploy() {
            gcloud run deploy "$1" --project "$PROJECT_ID" --region "$REGION" --platform managed \
              --image "$2" --service-account "$RUNTIME_SERVICE_ACCOUNT" \
              --port 8080 --allow-unauthenticated
          }
          deploy "$ADMIN_SERVICE" "$ADMIN_IMAGE"
          deploy "$SUPER_ADMIN_SERVICE" "$SUPER_ADMIN_IMAGE"
          deploy "$CUSTOMER_SERVICE" "$CUSTOMER_IMAGE"
          deploy "$LANDING_SERVICE" "$LANDING_IMAGE"

      - name: Verify production endpoints
        run: |
          set -euo pipefail
          for url in \
            https://masterbox.masterappinc.com/ \
            https://admin.masterbox.masterappinc.com/ \
            https://superadmin.masterappinc.com/ \
            https://masterboxapp.masterappinc.com/; do
            curl --fail --silent --show-error --location --max-time 30 "$url" >/dev/null
          done
          curl --fail --silent --show-error --max-time 30 \
            -H 'Content-Type: application/json' \
            --data '{"query":"{ __typename }"}' \
            https://api.masterbox.masterappinc.com/graphql >/dev/null
